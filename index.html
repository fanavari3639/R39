<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی ریاضی سوم ابتدایی - اندازه‌گیری</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

        :root {
            --primary-color: #ff7eb3;
            --secondary-color: #ff758c;
            --bg-color: #f0f8ff;
            --card-bg: #ffffff;
            --text-color: #333;
            --success-color: #4caf50;
            --error-color: #f44336;
            --accent-color: #ffeb3b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #fce4ec);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            border: 3px solid var(--primary-color);
        }

        .container::before {
            content: "🌸";
            position: absolute; top: 10px; left: 10px;
            font-size: 40px; opacity: 0.3;
        }
        .container::after {
            content: "🕌";
            position: absolute; bottom: 10px; right: 10px;
            font-size: 40px; opacity: 0.3;
        }

        h1, h2 {
            text-align: center;
            color: var(--secondary-color);
            margin-bottom: 20px;
        }
        h1 { font-size: 2rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }

        .hidden { display: none !important; }

        #login-section { text-align: center; padding: 40px 20px; }

        input[type="text"] {
            width: 80%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 15px;
            font-family: inherit;
            font-size: 1.1rem;
            text-align: center;
            transition: all 0.3s;
        }
        input[type="text"]:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 10px rgba(255, 126, 179, 0.5);
        }

        button {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(255, 117, 140, 0.4);
            margin-top: 20px;
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(255, 117, 140, 0.6); }
        button:active { transform: translateY(0); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* نوار اطلاعات بازی */
        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: #fff0f6;
            border: 2px solid #ffd6e6;
            border-radius: 14px;
            padding: 10px 14px;
            margin-bottom: 12px;
            font-size: 0.95rem;
            flex-wrap: wrap;
        }
        .game-info .info-item {
            background: white;
            padding: 6px 12px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-weight: bold;
        }
        .game-info .info-item span { color: var(--secondary-color); }

        .question-card {
            background: #f9f9f9;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border-right: 5px solid var(--primary-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        /* لرزش هنگام پاسخ غلط */
        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .question-text { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; line-height: 1.6; }

        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .option-btn {
            background-color: white;
            color: var(--text-color);
            border: 2px solid #ddd;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.2s;
            margin-top: 0;
            box-shadow: none;
            text-align: center;
        }
        .option-btn:hover:not(:disabled) { background-color: #f0f0f0; border-color: var(--primary-color); }
        .option-btn.selected { background-color: var(--primary-color); color: white; border-color: var(--secondary-color); box-shadow: 0 0 10px rgba(255, 126, 179, 0.5); }
        .option-btn.correct-answer { background-color: #dcedc8 !important; border-color: var(--success-color) !important; color: #2e7d32 !important; }
        .option-btn.wrong-answer { background-color: #ffcdd2 !important; border-color: var(--error-color) !important; color: #c62828 !important; }
        .option-btn:disabled { cursor: not-allowed; }

        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            text-align: center;
            display: none;
            line-height: 1.7;
        }
        .feedback.correct { background-color: #dcedc8; color: var(--success-color); display: block; animation: pop 0.5s; }
        .feedback.wrong { background-color: #ffcdd2; color: var(--error-color); display: block; animation: pop 0.5s; }
        .feedback .hint { display: block; font-size: 0.9rem; margin-top: 6px; color: #555; font-weight: normal; }

        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #eee;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            width: 0%;
            transition: width 0.3s;
        }

        #report-section { text-align: center; }

        .report-card {
            background: #fff;
            border: 3px dashed var(--primary-color);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            position: relative;
        }
        .report-card::before {
            content: "🏆";
            position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
            font-size: 40px; background: white; padding: 0 10px; border-radius: 50%;
        }

        .score-circle {
            width: 120px; height: 120px; border-radius: 50%;
            background: conic-gradient(var(--primary-color) var(--score-deg), #eee 0deg);
            display: flex; justify-content: center; align-items: center;
            margin: 20px auto; font-size: 2rem; font-weight: bold; color: var(--secondary-color);
        }
        .score-circle span {
            background: white; width: 90px; height: 90px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
        }

        .report-details { text-align: right; margin-top: 20px; font-size: 1.1rem; line-height: 1.8; }
        .report-details p { border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }

        .emoji-large { font-size: 3rem; margin: 10px 0; }

        .btn-group { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .btn-print { background: linear-gradient(45deg, #4facfe, #00f2fe); box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4); }
        .btn-send { background: linear-gradient(45deg, #43e97b, #38f9d7); box-shadow: 0 5px 15px rgba(67, 233, 123, 0.4); }

        /* لیست پاسخ‌های کارنامه */
        .answers-review {
            text-align: right;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        .answers-review .answer-row {
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 6px;
            background: #fafafa;
            border-right: 4px solid #ccc;
        }
        .answers-review .answer-row.correct { border-right-color: var(--success-color); background: #f1f8e9; }
        .answers-review .answer-row.wrong { border-right-color: var(--error-color); background: #ffebee; }

        /* =====================================================
           استایل چاپ: کارنامه در یک برگ A4 جا شود
           ===================================================== */
        @page {
            size: A4 portrait;
            margin: 10mm;
        }

        @media print {
            html, body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100%;
                height: auto;
            }

            body {
                display: block !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                font-size: 11px;
            }

            .container {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
                max-width: 100% !important;
                border-radius: 0 !important;
                overflow: visible !important;
                background: white !important;
            }
            .container::before,
            .container::after { display: none !important; }

            .no-print { display: none !important; }

            #login-section,
            #game-section { display: none !important; }

            #report-section {
                display: block !important;
                text-align: center;
                page-break-after: avoid;
            }

            .report-card {
                border: 2px solid #333 !important;
                border-radius: 8px !important;
                padding: 10px 12px !important;
                margin: 0 !important;
                page-break-inside: avoid;
                page-break-after: avoid;
            }
            .report-card::before { display: none !important; }

            .report-card h2 {
                font-size: 16px !important;
                margin-bottom: 8px !important;
                color: #333 !important;
            }

            .report-details {
                margin-top: 6px !important;
                font-size: 10.5px !important;
                line-height: 1.45 !important;
            }
            .report-details p {
                padding-bottom: 3px !important;
                margin-bottom: 3px !important;
                border-bottom: 1px solid #eee !important;
            }
            .report-details p:last-child { margin-bottom: 0 !important; }

            /* کوچک کردن دایره نمره */
            .score-circle {
                width: 80px !important;
                height: 80px !important;
                margin: 8px auto !important;
                font-size: 1.3rem !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .score-circle span {
                width: 60px !important;
                height: 60px !important;
                font-size: 1.3rem !important;
            }

            .emoji-large { font-size: 1.6rem !important; margin: 2px 0 !important; }
            #performance-text { font-size: 11px !important; }

            /* مرور پاسخ‌ها: دو ستونی و فشرده */
            .answers-review {
                margin-top: 6px !important;
                font-size: 9px !important;
                column-count: 2 !important;
                column-gap: 10px !important;
                line-height: 1.35 !important;
            }
            .answers-review .answer-row {
                padding: 3px 5px !important;
                margin-bottom: 3px !important;
                border-right-width: 3px !important;
                break-inside: avoid;
                page-break-inside: avoid;
                font-size: 9px !important;
            }
            .answers-review .answer-row strong { font-size: 9px !important; }

            /* عنوان مرور پاسخ‌ها */
            .report-card h3 {
                margin-top: 8px !important;
                margin-bottom: 4px !important;
                font-size: 12px !important;
            }
        }

        @media (max-width: 600px) {
            .options { grid-template-columns: 1fr; }
            .container { padding: 15px; }
            .game-info { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- صفحه ورود -->
    <div id="login-section">
        <h1>🌸 سلام دختر گلم 🌸</h1>
        <p>به بازی ریاضی خوش آمدی!</p>
        <input type="text" id="student-name" placeholder="نام و نام خانوادگی خود را وارد کن" required>
        <br>
        <button onclick="startGame()">شروع بازی 🚀</button>
    </div>

    <!-- صفحه بازی -->
    <div id="game-section" class="hidden">
        <h2 id="welcome-msg"></h2>

        <div class="game-info">
            <div class="info-item">📋 سوال <span id="q-counter">۱ از ۸</span></div>
            <div class="info-item">⭐ امتیاز <span id="score-counter">۰</span></div>
            <div class="info-item">📈 پیشرفت <span id="percent-counter">۰٪</span></div>
        </div>

        <div class="progress-bar">
            <div class="progress" id="progress-bar"></div>
        </div>

        <div id="question-container"></div>

        <div id="feedback" class="feedback"></div>

        <div style="text-align: center; margin-top: 20px;" class="no-print">
            <button id="next-btn" class="hidden" onclick="nextQuestion()">سوال بعدی ⏩</button>
        </div>
    </div>

    <!-- صفحه کارنامه -->
    <div id="report-section" class="hidden">
        <div class="report-card" id="printable-report">
            <h2>کارنامه عملکرد دانش‌آموز</h2>
            <div class="report-details">
                <p><strong>نام و نام خانوادگی:</strong> <span id="report-name"></span></p>
                <p><strong>تاریخ:</strong> <span id="report-date"></span></p>
                <p><strong>پایه:</strong> سوم ابتدایی</p>
                <p><strong>درس:</strong> ریاضی (اندازه‌گیری و جرم)</p>
            </div>

            <div class="score-circle" id="score-circle">
                <span id="final-score">0</span>
            </div>

            <div class="emoji-large" id="performance-emoji">🌟</div>
            <p id="performance-text" style="font-weight: bold; color: var(--secondary-color); font-size: 1.2rem;"></p>

            <div class="report-details" style="margin-top: 20px;">
                <p><strong>تعداد کل سوالات:</strong> <span id="total-q"></span></p>
                <p><strong>پاسخ‌های صحیح:</strong> <span id="correct-q" style="color: var(--success-color);"></span></p>
                <p><strong>پاسخ‌های نادرست:</strong> <span id="wrong-q" style="color: var(--error-color);"></span></p>
                <p><strong>نمره نهایی از ۲۰:</strong> <span id="final-grade" style="font-size: 1.5rem; font-weight: bold; color: var(--primary-color);"></span></p>
            </div>

            <h3 style="margin-top: 20px; color: var(--secondary-color);">📝 مرور پاسخ‌ها</h3>
            <div class="answers-review" id="answers-review"></div>
        </div>

        <div class="btn-group no-print">
            <button class="btn-print" onclick="window.print()">چاپ کارنامه 🖨️</button>
            <button class="btn-send" onclick="sendReport()">ارسال برای معلم 📧</button>
            <button onclick="location.reload()" style="background: #999;">بازی مجدد 🔄</button>
        </div>
    </div>
</div>

<script>
    // بانک سوالات
    const questionBank = [
        {
            id: 1,
            text: "۳۲۵ سانتی‌متر یعنی چند متر و چند سانتی‌متر؟",
            options: ["۳ متر و ۲۵ سانتی‌متر", "۳۲ متر و ۵ سانتی‌متر", "۳ متر و ۵ سانتی‌متر", "۲ متر و ۳۵ سانتی‌متر"],
            correctText: "۳ متر و ۲۵ سانتی‌متر",
            hint: "هر ۱۰۰ سانتی‌متر برابر ۱ متر است."
        },
        {
            id: 2,
            text: "۴۲۰ سانتی‌متر یعنی چند متر و چند سانتی‌متر؟",
            options: ["۴ متر و ۲۰ سانتی‌متر", "۴۲ متر و ۰ سانتی‌متر", "۲ متر و ۴۰ سانتی‌متر", "۴ متر و ۲ سانتی‌متر"],
            correctText: "۴ متر و ۲۰ سانتی‌متر",
            hint: "۴۰۰ سانتی‌متر ۴ متر است و ۲۰ سانتی‌متر باقی می‌ماند."
        },
        {
            id: 3,
            text: "یک کیلومتر چند تا ۱۰۰ متر است؟",
            options: ["۱۰ تا", "۱۰۰ تا", "۱۰۰۰ تا", "۵ تا"],
            correctText: "۱۰ تا",
            hint: "۱۰۰ متر ضربدر ۱۰ می‌شود ۱۰۰۰ متر که همان ۱ کیلومتر است."
        },
        {
            id: 4,
            text: "۹ کیلومتر چند متر است؟",
            options: ["۹۰۰ متر", "۹۰۰۰ متر", "۹۰ متر", "۹۰۰۰۰ متر"],
            correctText: "۹۰۰۰ متر",
            hint: "هر کیلومتر ۱۰۰۰ متر است، پس ۹ کیلومتر ۹۰۰۰ متر می‌شود."
        },
        {
            id: 5,
            text: "۴۰۰۰ متر چند کیلومتر است؟",
            options: ["۴ کیلومتر", "۴۰ کیلومتر", "۴۰۰ کیلومتر", "۰.۴ کیلومتر"],
            correctText: "۴ کیلومتر",
            hint: "۴۰۰۰ متر را بر ۱۰۰۰ تقسیم می‌کنیم تا کیلومتر به دست آید."
        },
        {
            id: 6,
            text: "۳ کیلومتر و ۲۰۰ متر یعنی چند متر؟",
            options: ["۳۲۰۰ متر", "۳۲۰ متر", "۳۰۰۲۰ متر", "۳۰۲۰ متر"],
            correctText: "۳۲۰۰ متر",
            hint: "۳ کیلومتر می‌شود ۳۰۰۰ متر، به علاوه ۲۰۰ متر می‌شود ۳۲۰۰ متر."
        },
        {
            id: 7,
            text: "برای اندازه‌گیری جرم یک جعبه شیرینی، آن را در یک کفه‌ی ترازو و وزنه‌های ۵۰۰ گرمی، ۲۵۰ گرمی و ۱۰۰ گرمی را در کفه‌ی دیگر گذاشتیم تا ترازو میزان بایستند. جرم جعبه شیرینی چقدر است؟",
            options: ["۸۵۰ گرم", "۷۵۰ گرم", "۶۵۰ گرم", "۹۵۰ گرم"],
            correctText: "۸۵۰ گرم",
            hint: "وزنه‌ها را با هم جمع می‌کنیم: ۵۰۰ + ۲۵۰ + ۱۰۰ = ۸۵۰"
        },
        {
            id: 8,
            text: "ترازوی روبه‌رو جرم هندوانه را ۳۹۷۳ گرم نشان داده است. این یعنی چند کیلوگرم و چند گرم؟",
            options: ["۳ کیلوگرم و ۹۷۳ گرم", "۳۹ کیلوگرم و ۷۳ گرم", "۳ کیلوگرم و ۷۳ گرم", "۹ کیلوگرم و ۳۷۳ گرم"],
            correctText: "۳ کیلوگرم و ۹۷۳ گرم",
            hint: "هر ۱۰۰۰ گرم ۱ کیلوگرم است. ۳۰۰۰ گرم می‌شود ۳ کیلوگرم و ۹۷۳ گرم باقی می‌ماند."
        }
    ];

    // سوالات جاری این دور بازی (بعد از shuffle)
    let questions = [];

    let currentQuestionIndex = 0;
    let studentName = "";
    let score = 0;
    let answers = [];
    let hasAnswered = false;
    let currentOptions = [];

    function toFa(num) {
        return String(num).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
    }

    function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function startGame() {
        studentName = document.getElementById('student-name').value.trim();
        if (!studentName) {
            alert("لطفاً نام و نام خانوادگی خود را وارد کنید.");
            return;
        }

        // ✅ رندوم کردن ترتیب سوالات در هر بار بازی
        questions = shuffle(questionBank);

        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('game-section').classList.remove('hidden');
        document.getElementById('welcome-msg').innerText = `سلام ${studentName} عزیز! 🌸`;

        currentQuestionIndex = 0;
        score = 0;
        answers = [];

        loadQuestion();
    }

    function updateInfoBar() {
        const total = questions.length;
        const qNo = currentQuestionIndex + 1;
        document.getElementById('q-counter').innerText = `${toFa(qNo)} از ${toFa(total)}`;
        document.getElementById('score-counter').innerText = toFa(score);
        const percent = Math.round((currentQuestionIndex / total) * 100);
        document.getElementById('percent-counter').innerText = `${toFa(percent)}٪`;
        document.getElementById('progress-bar').style.width = `${percent}%`;
    }

    function loadQuestion() {
        if (currentQuestionIndex >= questions.length) {
            showReport();
            return;
        }

        hasAnswered = false;
        const q = questions[currentQuestionIndex];
        currentOptions = shuffle(q.options);

        updateInfoBar();

        const container = document.getElementById('question-container');
        container.innerHTML = `
            <div class="question-card" id="question-card">
                <div class="question-text">${toFa(currentQuestionIndex + 1)}. ${q.text}</div>
                <div class="options">
                    ${currentOptions.map((opt, index) => `
                        <button class="option-btn" onclick="selectOption(${index})" id="opt-${index}">${opt}</button>
                    `).join('')}
                </div>
            </div>
        `;

        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('next-btn').disabled = false;
        document.getElementById('next-btn').innerText = currentQuestionIndex === questions.length - 1 ? "مشاهده کارنامه 📋" : "سوال بعدی ⏩";

        const feedback = document.getElementById('feedback');
        feedback.className = 'feedback';
        feedback.style.display = 'none';
        feedback.innerHTML = '';
    }

    function selectOption(selectedIndex) {
        if (hasAnswered) return;
        hasAnswered = true;

        const q = questions[currentQuestionIndex];
        const feedback = document.getElementById('feedback');
        const card = document.getElementById('question-card');
        const options = document.querySelectorAll('.option-btn');

        const selectedText = currentOptions[selectedIndex];
        const isCorrect = (selectedText === q.correctText);

        options.forEach(btn => { btn.disabled = true; });
        options[selectedIndex].classList.add(isCorrect ? 'correct-answer' : 'wrong-answer');

        if (!isCorrect) {
            const correctIndex = currentOptions.indexOf(q.correctText);
            if (correctIndex !== -1) options[correctIndex].classList.add('correct-answer');
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 600);
        }

        answers.push({
            question: q.text,
            selected: selectedText,
            correctAnswer: q.correctText,
            isCorrect: isCorrect
        });

        if (isCorrect) {
            score++;
            feedback.innerHTML = `🎉 آفرین ${studentName} عزیز! پاسخ صحیح است. 🌟`;
            feedback.className = "feedback correct";
            createConfetti();
        } else {
            feedback.innerHTML = `❌ متاسفانه پاسخ صحیح نیست.<br>
                <span style="color: var(--success-color);">پاسخ درست: ${q.correctText}</span>
                <span class="hint">💡 راهنما: ${q.hint}</span>`;
            feedback.className = "feedback wrong";
            document.body.style.transition = "background 0.3s";
            document.body.style.background = "#ffe5e5";
            setTimeout(() => { document.body.style.background = ""; }, 400);
        }

        updateInfoBar();
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
        currentQuestionIndex++;
        loadQuestion();
    }

    function showReport() {
        document.getElementById('game-section').classList.add('hidden');
        document.getElementById('report-section').classList.remove('hidden');

        const total = questions.length;
        const correct = score;
        const wrong = total - correct;
        const grade = Math.round((correct / total) * 20);

        document.getElementById('report-name').innerText = studentName;
        const now = new Date();
        document.getElementById('report-date').innerText = now.toLocaleDateString('fa-IR');

        document.getElementById('total-q').innerText = toFa(total);
        document.getElementById('correct-q').innerText = toFa(correct);
        document.getElementById('wrong-q').innerText = toFa(wrong);
        document.getElementById('final-grade').innerText = toFa(grade);

        const scoreCircle = document.getElementById('score-circle');
        const deg = (grade / 20) * 360;
        scoreCircle.style.setProperty('--score-deg', `${deg}deg`);
        document.getElementById('final-score').innerText = toFa(grade);

        let emoji = "🌟";
        let perfText = "";
        if (grade >= 18) {
            emoji = "🏆"; perfText = "عالی! تو یک نابغه ریاضی هستی! 🌸";
        } else if (grade >= 15) {
            emoji = "😊"; perfText = "خیلی خوب! کمی تمرین بیشتر و عالی می‌شی.";
        } else if (grade >= 10) {
            emoji = "💪"; perfText = "خوب بود، اما با تمرین بیشتر می‌تونی بهتر بشی.";
        } else {
            emoji = "📚"; perfText = "نگران نباش! با کمی دقت و تمرین، دفعه بعد بهتر می‌شی.";
        }
        document.getElementById('performance-emoji').innerText = emoji;
        document.getElementById('performance-text').innerText = perfText;

        const review = document.getElementById('answers-review');
        review.innerHTML = answers.map((ans, i) => `
            <div class="answer-row ${ans.isCorrect ? 'correct' : 'wrong'}">
                <strong>${toFa(i + 1)}. ${ans.isCorrect ? '✅' : '❌'}</strong> ${ans.question}
                ${ans.isCorrect ? '' : `<div style="font-size:0.85rem; margin-top:4px;">
                    پاسخ شما: <span style="color:var(--error-color);">${ans.selected}</span> |
                    پاسخ درست: <span style="color:var(--success-color);">${ans.correctAnswer}</span>
                </div>`}
            </div>
        `).join('');

        window.reportData = {
            name: studentName,
            grade: grade,
            correct: correct,
            wrong: wrong,
            date: now.toLocaleDateString('fa-IR'),
            answers: answers
        };
    }

    function sendReport() {
        const data = window.reportData;
        let message = `📋 *کارنامه دانش‌آموز*\n`;
        message += `👤 نام: ${data.name}\n`;
        message += `📅 تاریخ: ${data.date}\n`;
        message += `📊 نمره: ${data.grade} از ۲۰\n`;
        message += `✅ صحیح: ${data.correct} | ❌ غلط: ${data.wrong}\n`;
        message += `------------------------\n📝 *جزئیات پاسخ‌ها:*\n`;

        data.answers.forEach((ans, i) => {
            message += `${i + 1}. ${ans.isCorrect ? '✅' : '❌'} ${ans.question}\n`;
            if (!ans.isCorrect) {
                message += `   پاسخ شما: ${ans.selected} | پاسخ درست: ${ans.correctAnswer}\n`;
            }
        });

        navigator.clipboard.writeText(message).then(() => {
            alert("✅ کارنامه با موفقیت کپی شد! می‌توانید آن را برای معلم ارسال کنید.\n\n" + message);
        }).catch(err => {
            alert("خطا در کپی کردن: " + err);
        });
    }

    function createConfetti() {
        const colors = ['#ff7eb3', '#ff758c', '#ffeb3b', '#4caf50', '#2196f3'];
        for (let i = 0; i < 30; i++) {
            const confetti = document.createElement('div');
            confetti.style.position = 'fixed';
            confetti.style.width = '10px';
            confetti.style.height = '10px';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.top = '-10px';
            confetti.style.borderRadius = '50%';
            confetti.style.zIndex = '9999';
            confetti.style.pointerEvents = 'none';
            confetti.style.transition = 'transform 2s ease-in, opacity 2s';
            document.body.appendChild(confetti);
            setTimeout(() => {
                confetti.style.transform = `translate(${Math.random() * 200 - 100}px, ${window.innerHeight}px) rotate(${Math.random() * 720}deg)`;
                confetti.style.opacity = '0';
            }, 10);
            setTimeout(() => confetti.remove(), 2000);
        }
    }
</script>
